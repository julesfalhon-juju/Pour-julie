<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pour toi</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d1446;font-family:'Cormorant Garamond',Georgia,serif}
#sky{position:fixed;inset:0;background:linear-gradient(#1d1446 0%,#6b2a74 22%,#d6475f 38%,#ff8a4c 47%,#ffcf7a 50%)}
#sun{position:fixed;left:50%;top:calc(50% - 7vmin);width:26vmin;height:26vmin;margin:-13vmin 0 0 -13vmin;border-radius:50%;background:radial-gradient(circle,#fff6d0,#ffd36e 55%,#ff9a4a);box-shadow:0 0 12vmin 5vmin rgba(255,170,90,.55)}
#sea{position:fixed;left:0;right:0;top:50%;bottom:0;background:linear-gradient(#c2506a,#4a1d57 18%,#1b1033)}
#sea::after{content:"";position:absolute;left:50%;top:0;width:14vmin;height:70%;transform:translateX(-50%);background:linear-gradient(rgba(255,210,120,.75),transparent);filter:blur(1.2vmin)}
#photos{position:fixed;inset:0;pointer-events:none;transition:opacity 1.5s}
.pol{position:absolute;width:17vmin;box-sizing:border-box;background:#fff;padding:.9vmin .9vmin 3vmin;box-shadow:0 1vmin 3vmin rgba(0,0,0,.45);transform:translate(-50%,-50%) rotate(var(--r)) scale(0);transition:transform .7s cubic-bezier(.2,1.4,.4,1)}
.pol.on{transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}
.pol img,.ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:linear-gradient(135deg,#ffb88c,#de6262);color:#fff;font-size:5vmin;text-align:center;line-height:13vmin}
canvas{position:fixed;inset:0;z-index:2}
#msg{position:fixed;top:4%;left:0;right:0;z-index:5;text-align:center;color:#fff;padding:0 5vw;pointer-events:none;text-shadow:0 2px 14px rgba(60,10,50,.7)}
#msg .a{font-size:clamp(22px,5vmin,40px);font-style:italic;font-weight:500;line-height:1.2}
#msg .b{font-size:clamp(30px,8vmin,64px);font-style:italic;font-weight:700;line-height:1.1}
#msg .b.inf{color:#ffe08a;letter-spacing:.06em;font-size:clamp(34px,9vmin,72px)}
#msg.pop{animation:pop .45s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:none}}
#hint{position:fixed;bottom:3%;left:0;right:0;z-index:5;text-align:center;color:#ffe9d6;font-style:italic;font-size:clamp(16px,3vmin,22px);opacity:.85;pointer-events:none;transition:opacity 1s}
#end{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;background:rgba(27,16,51,.82);opacity:0;pointer-events:none;transition:opacity 2s;padding:5vmin;box-sizing:border-box;text-align:center}
#end.on{opacity:1}
#end .pol{position:static;width:min(62vmin,80vw);transform:rotate(-2deg) scale(1);transition:none}
#end .pol .ph{line-height:50vmin;font-size:14vmin}
#end p{margin:0;color:#fff;font-style:italic;font-weight:700;font-size:clamp(26px,6.5vmin,52px);line-height:1.2;text-shadow:0 2px 14px rgba(60,10,50,.7)}
@media (prefers-reduced-motion:reduce){#msg.pop{animation:none}}
</style>
</head>
<body>
<div id="sky"></div><div id="sun"></div><div id="sea"></div>
<div id="photos"></div>
<div id="msg"></div>
<div id="end"><div class="pol"><img id="endImg" src="photos/fin.jpg" alt=""></div><p>Je veux te revoir Julie,<br>je t'aime ❤️</p></div>
<div id="hint">Glisse pour faire tourner le bouquet</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ====== À PERSONNALISER ====== */
// Mets tes 15 photos dans un dossier "photos" : 1.jpg ... 15.jpg
// (la photo n° 1 apparaît quand elle retire la 1re rose, etc.)
const PHOTOS = Array.from({length:15}, (_, i) => `photos/${i+1}.jpg`);
const WORDS = ["un peu","beaucoup","passionnément","à la folie","pas du tout"];
/* ============================= */

const $ = id => document.getElementById(id);
const msg = $('msg');
function setMsg(a, b, cls) {
  msg.innerHTML = `<div class="a">${a}</div>` + (b ? `<div class="b ${cls||''}">${b}</div>` : '');
  msg.classList.remove('pop'); void msg.offsetWidth; msg.classList.add('pop');
}
setMsg('Retire toutes les roses');

// ---------- Scène ----------
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 300);
const HOME = new THREE.Vector3(0, .6, Math.max(7.4, 4.4/(innerWidth/innerHeight)));
camera.position.copy(HOME);
scene.add(camera);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, .2, 0);
Object.assign(controls, {enablePan:false, enableDamping:true, minDistance:4, maxDistance:14, maxPolarAngle:Math.PI*.62});
controls.addEventListener('start', () => $('hint').style.opacity = 0);

scene.add(new THREE.HemisphereLight(0xffd9c0, 0x3a1a4a, .9));
const back = new THREE.DirectionalLight(0xffa860, 1.1); back.position.set(-2, 3, -6); scene.add(back);
const front = new THREE.DirectionalLight(0xffe6d0, .9); front.position.set(2, 3, 6); camera.add(front);

// ---------- Rose ----------
const petalG = new THREE.SphereGeometry(1, 10, 8, 0, 1.6, .15, 1.2).rotateY(.78);
const RINGS = [[5,.17,.05,0x6e0a1c],[7,.24,.28,0x9a1030],[9,.31,.55,0xc41a3c],[11,.37,.85,0xd8284a]];
const ringMats = RINGS.map(r => new THREE.MeshStandardMaterial({color:r[3], roughness:.55, side:THREE.DoubleSide}));
const green = new THREE.MeshStandardMaterial({color:0x2f7a3a, roughness:.7, side:THREE.DoubleSide});

function makeRose(L) {
  const g = new THREE.Group();
  RINGS.forEach(([n, s, tilt], k) => {
    for (let i = 0; i < n; i++) {
      const a = i/n*Math.PI*2 + k*.6;
      const m = new THREE.Mesh(petalG, ringMats[k]);
      m.rotation.set(tilt, a, 0, 'YXZ');
      m.position.set(Math.sin(a)*s*.45, -s*.15, Math.cos(a)*s*.45);
      m.scale.set(s*1.1, s*1.25, s*.9);
      g.add(m);
    }
  });
  const bud = new THREE.Mesh(new THREE.SphereGeometry(.1, 10, 8), ringMats[0]);
  bud.scale.y = 1.3; bud.position.y = .08; g.add(bud);
  const calyx = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 6, 0, 6.3, 1.7, 1.4), green);
  calyx.scale.set(.22, .18, .22); calyx.position.y = -.02; g.add(calyx);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.03, .04, L + .1, 6).translate(0, -(L+.1)/2, 0), green);
  stem.position.y = -.1; g.add(stem);
  return g;
}

const bouquet = new THREE.Group();
bouquet.position.y = .1;
scene.add(bouquet);
const base = new THREE.Vector3(0, -1.7, 0);
const roses = [];
for (let k = 0; k < 15; k++) {
  const r = .31*Math.sqrt(k + .4), a = k*2.39996;
  const head = new THREE.Vector3(Math.cos(a)*r, 1.05 - r*r*.28 + (k%3)*.04, Math.sin(a)*r);
  const dir = head.clone().sub(base), L = dir.length();
  const rose = makeRose(L);
  rose.position.copy(head);
  rose.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  rose.scale.setScalar(.8);
  bouquet.add(rose); roses.push(rose);
}
// papier kraft + ruban
const cone = new THREE.Mesh(new THREE.ConeGeometry(1, 1.8, 28, 1, true), new THREE.MeshStandardMaterial({color:0xe9b7b0, roughness:.9, side:THREE.DoubleSide}));
cone.rotation.x = Math.PI; cone.position.y = -.8; bouquet.add(cone);
const ribbon = new THREE.Mesh(new THREE.TorusGeometry(.48, .04, 8, 32), new THREE.MeshStandardMaterial({color:0xe3b04b, metalness:.4, roughness:.4}));
ribbon.rotation.x = Math.PI/2; ribbon.position.y = -.85; bouquet.add(ribbon);

// ---------- Marguerite ----------
const daisy = new THREE.Group(), petals = [];
(function buildDaisy() {
  const white = new THREE.MeshStandardMaterial({color:0xfffdf6, roughness:.6, side:THREE.DoubleSide});
  const head = new THREE.Group(); head.position.y = 1.1; daisy.add(head);
  const pg = new THREE.SphereGeometry(1, 12, 8);
  for (let i = 0; i < 30; i++) {
    const piv = new THREE.Group();
    piv.rotation.z = i/30*Math.PI*2; piv.position.z = (i%2)*.012; head.add(piv);
    const m = new THREE.Mesh(pg, white);
    m.scale.set(.1, .42, .025); m.position.y = .62; piv.add(m); petals.push(m);
  }
  const c = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshStandardMaterial({color:0xffc83a, roughness:.8}));
  c.scale.set(.24, .24, .12); c.position.z = .03; head.add(c);
  const st = new THREE.Mesh(new THREE.CylinderGeometry(.04, .05, 3.2, 8), green); st.position.y = -.5; daisy.add(st);
  [-1, 1].forEach(s => {
    const l = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), green);
    l.scale.set(.4, .08, .15); l.rotation.z = s*.7; l.position.set(s*.32, -.5, 0); daisy.add(l);
  });
  daisy.position.y = -.3; daisy.scale.setScalar(.001);
})();

// ---------- Envols ----------
const fly = [];
function launch(o, vel, spin, g, life) {
  scene.attach(o);
  fly.push({o, vel, spin, g, life, t:0, s0:o.scale.x});
}
function popRose(o) {
  roses.splice(roses.indexOf(o), 1);
  const idx = 14 - roses.length;
  launch(o, new THREE.Vector3((Math.random()-.5)*1.5, 3.4, (Math.random()-.2)*1.5), new THREE.Vector3(Math.random()*2, Math.random()*3, Math.random()*2), 0, 1.9);
  addPhoto(idx);
  if (!roses.length) { phase = 'wait'; setMsg('Il reste une dernière surprise…'); setTimeout(startDaisy, 2200); }
}
function addPhoto(i) {
  const ang = (-90 + i*24) * Math.PI/180;
  const d = document.createElement('div');
  d.className = 'pol';
  d.style.left = (50 + 43*Math.cos(ang)) + '%';
  d.style.top = (54 + 33*Math.sin(ang)) + '%';
  d.style.setProperty('--r', ((i%2 ? 1 : -1) * (3 + (i*7)%6)) + 'deg');
  const img = new Image(); img.src = PHOTOS[i];
  img.onerror = () => { const p = document.createElement('div'); p.className = 'ph'; p.textContent = '❤'; img.replaceWith(p); };
  d.appendChild(img); $('photos').appendChild(d);
  setTimeout(() => d.classList.add('on'), 450);
}

// ---------- Phases ----------
let phase = 'roses', removed = 0, fin = null;
function startDaisy() {
  $('photos').style.opacity = .55;
  scene.add(daisy);
  setMsg('Effeuille la marguerite');
  fin = {t:0, kind:'grow'};
}
function popPetal(m) {
  petals.splice(petals.indexOf(m), 1);
  removed++;
  const inf = removed > 25;
  setMsg("Je t'aime", inf ? 'INFINIMENT' : WORDS[(removed-1) % 5], inf ? 'inf' : '');
  launch(m, new THREE.Vector3((Math.random()-.5)*1.6, 1 + Math.random(), 1.2), new THREE.Vector3(Math.random()*4, Math.random()*4, Math.random()*5), 4, 2.2);
  if (!petals.length) { phase = 'wait'; setTimeout(() => { phase = 'finale'; fin = {t:0, kind:'away', start:daisy.position.clone()}; }, 1400); }
}

function showEnd() {
  const img = $('endImg');
  img.onerror = () => { const p = document.createElement('div'); p.className = 'ph'; p.textContent = '❤'; img.replaceWith(p); };
  if (img.complete && !img.naturalWidth) img.onerror();
  $('end').classList.add('on');
  msg.style.transition = 'opacity 1s'; msg.style.opacity = 0;
}

// ---------- Clic ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), cv = renderer.domElement;
let down = null;
cv.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
cv.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 6) return;
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse, camera);
  if (phase === 'roses') {
    const hit = ray.intersectObjects(roses, true)[0];
    if (hit) { let o = hit.object; while (!roses.includes(o)) o = o.parent; popRose(o); }
  } else if (phase === 'daisy') {
    const hit = ray.intersectObjects(petals, false)[0];
    if (hit) popPetal(hit.object);
  }
});

// ---------- Boucle ----------
const clock = new THREE.Clock();
const ease = p => .5 - .5*Math.cos(Math.PI*Math.min(1, p));
const TARGET = new THREE.Vector3(0, HOME.y, -90);
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  for (let i = fly.length-1; i >= 0; i--) {
    const f = fly[i]; f.t += dt;
    f.vel.y -= f.g*dt;
    f.o.position.addScaledVector(f.vel, dt);
    f.o.rotation.x += f.spin.x*dt; f.o.rotation.y += f.spin.y*dt; f.o.rotation.z += f.spin.z*dt;
    f.o.scale.setScalar(f.s0 * Math.max(.001, 1 - Math.max(0, f.t - f.life*.5)/(f.life*.5)));
    if (f.t > f.life) { scene.remove(f.o); fly.splice(i, 1); }
  }
  if (fin) {
    fin.t += dt;
    if (fin.kind === 'grow') {
      daisy.scale.setScalar(Math.max(.001, ease(fin.t/1.4)));
      if (fin.t > 1.4) { fin = null; phase = 'daisy'; }
    } else if (fin.kind === 'away') {
      const p = ease(fin.t/5);
      daisy.position.lerpVectors(fin.start, TARGET, p);
      daisy.rotation.z = p*1.2;
      if (p > .6 && !fin.said) { fin.said = 1; setMsg("C'est vrai, tu m'aimes infiniment ?", 'Moi aussi ♥'); }
      if (fin.t > 5) { scene.remove(daisy); fin = null; setTimeout(showEnd, 4000); }
    }
  }
  if (phase === 'daisy') daisy.rotation.z = Math.sin(clock.elapsedTime*1.2)*.03;
  if (phase === 'finale') { camera.position.lerp(HOME, .04); camera.lookAt(controls.target); }
  else controls.update();
  renderer.render(scene, camera);
})();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
